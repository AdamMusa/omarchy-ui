name: Verify published plugin artifacts

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/verify-plugin-artifacts.yml
      - lib/omarchy_ui/artifact_verifier.rb
      - lib/omarchy_ui/qml_compiler.rb
      - lib/omarchy_ui/runtime.rb
      - script/verify-plugin-package.rb

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  verify:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    container:
      image: archlinux@sha256:84cd9ef000b3cff245ec028e87965b84724f4bf1cc63fc2741ba927b88515ed6
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Storage Horizon
            slug: storage-horizon
            repository: AdamMusa/omarchy-storage-horizon
            ref: 624aa57afc67db32d41d76c901ff7f4ac053b7f8
          - name: Layer Atlas
            slug: layer-atlas
            repository: AdamMusa/omarchy-layer-atlas
            ref: 2ccd824755e4b9c3cca9ce9eaeed7ebaa9a59eaa
          - name: Plugin Pulse
            slug: plugin-pulse
            repository: AdamMusa/omarchy-plugin-pulse
            ref: c11d6593b091924953cb2a4bc8c2c5fb67d7d75b
          - name: Env Bridge
            slug: env-bridge
            repository: AdamMusa/omarchy-env-bridge
            ref: 80e7195c585c68b33d461650d7eee0939f17e41b
          - name: Boot Trace
            slug: boot-trace
            repository: AdamMusa/omarchy-boot-trace
            ref: 556473cf37ca4cd5b7046dae0d577079fc45e933
          - name: Portal Doctor
            slug: portal-doctor
            repository: AdamMusa/omarchy-portal-doctor
            ref: ca007acde63c3b56294f1f16dbe034c597944bc7
          - name: Config Prism
            slug: config-prism
            repository: AdamMusa/omarchy-config-prism
            ref: 7a5a456326499a4c6173cdb717dabd502f91610e
          - name: Omarchy Phone
            slug: omarchy-phone
            repository: AdamMusa/omarchy-phone
            ref: 5b4d275b555abb9e3fed3100ee14af5e83fc0a82
          - name: Reminder Sprite
            slug: reminder-sprite
            repository: AdamMusa/reminder-sprite
            ref: b82499e0d0a274ea806e500412f2882102c8af5d

    steps:
      - name: Check out verifier
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Check out exact plugin commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.ref }}
          path: plugin

      - name: Install pinned Omarchy build environment
        shell: bash
        run: |
          sed -i '1cServer = https://archive.archlinux.org/repos/2026/08/28/$repo/os/$arch' /etc/pacman.d/mirrorlist
          sed -i '2,$d' /etc/pacman.d/mirrorlist
          pacman -Syy --noconfirm
          pacman -S --noconfirm --needed ruby qt6-declarative cmake ninja git curl
          curl --location --fail --silent --show-error \
            --output /tmp/quickshell.pkg.tar.zst \
            https://pkgs.omarchy.org/stable/x86_64/quickshell-git-0.3.0.r20.g28771c7-2-x86_64.pkg.tar.zst
          echo '048cc4a3d54bd164b8589f756eb075f0688d9bd24949b734a5edb4e217b8ba30  /tmp/quickshell.pkg.tar.zst' | sha256sum --check --strict
          pacman -U --noconfirm /tmp/quickshell.pkg.tar.zst
          curl --location --fail --silent --show-error \
            --output /tmp/bundler-4.0.18.gem \
            https://rubygems.org/downloads/bundler-4.0.18.gem
          curl --location --fail --silent --show-error \
            --output /tmp/zui-0.0.10.gem \
            https://rubygems.org/downloads/zui-0.0.10.gem
          echo '02d9a17429de1847b4e0c9f27a9ee4b20c0a74c0a641b4e77195d6019e3618ac  /tmp/bundler-4.0.18.gem' | sha256sum --check --strict
          echo 'ceec71d836c396b9944c85d5f472d34f14596a28a6dbf0c0b4687a01031627c0  /tmp/zui-0.0.10.gem' | sha256sum --check --strict
          gem install --local --no-document /tmp/bundler-4.0.18.gem
          gem install --local --no-document /tmp/zui-0.0.10.gem

      - name: Rebuild and compare every derived artifact
        run: >-
          ruby script/verify-plugin-package.rb plugin
          --output ${{ matrix.slug }}-verification.json

      - name: Sign GitHub artifact attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: |
            ${{ matrix.slug }}-verification.json
            plugin/omarchy-ui-runtime
            plugin/OmarchyUI/Bundles/*/*.so

      - name: Upload verification report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ matrix.slug }}-verification
          path: ${{ matrix.slug }}-verification.json
          if-no-files-found: error
