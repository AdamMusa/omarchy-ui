<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="420" viewBox="0 0 1440 420" role="img" aria-labelledby="title description">
  <title id="title">Omarchy UI</title>
  <desc id="description">A dark green documentation banner showing a Ruby interface definition beside native Omarchy surfaces.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080b09"/>
      <stop offset="0.55" stop-color="#0d1510"/>
      <stop offset="1" stop-color="#172518"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c8ff5a"/>
      <stop offset="1" stop-color="#76e247"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#172019"/>
      <stop offset="1" stop-color="#0f1511"/>
    </linearGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M 44 0 L 0 0 0 44" fill="none" stroke="#b8ff6a" stroke-opacity="0.055"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000" flood-opacity="0.42"/>
    </filter>
  </defs>

  <rect width="1440" height="420" rx="28" fill="url(#background)"/>
  <rect width="1440" height="420" rx="28" fill="url(#grid)"/>
  <circle cx="250" cy="205" r="188" fill="#7dff46" fill-opacity="0.075" filter="url(#glow)"/>
  <circle cx="1280" cy="30" r="220" fill="#9cff55" fill-opacity="0.055" filter="url(#glow)"/>

  <g transform="translate(94 76)">
    <rect width="66" height="66" rx="17" fill="url(#accent)"/>
    <path d="M18 19h32v9L30 46h21v9H16v-9l21-18H18z" fill="#0a100b"/>
    <text x="84" y="27" fill="#f5f7f2" font-family="Inter,Segoe UI,sans-serif" font-size="24" font-weight="700" letter-spacing="0.5">OMARCHY UI</text>
    <text x="84" y="54" fill="#93a398" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="14" letter-spacing="1.3">RUBY · ZUI · QUICKSHELL</text>

    <text x="0" y="150" fill="#f7f8f5" font-family="Inter,Segoe UI,sans-serif" font-size="56" font-weight="750" letter-spacing="-1.8">Native interfaces.</text>
    <text x="0" y="214" fill="#b5ff5d" font-family="Inter,Segoe UI,sans-serif" font-size="56" font-weight="750" letter-spacing="-1.8">Written in Ruby.</text>
    <text x="2" y="264" fill="#a7b1a9" font-family="Inter,Segoe UI,sans-serif" font-size="18">Applications and shell plugins for Omarchy—without application-owned QML.</text>
  </g>

  <g transform="translate(830 54)" filter="url(#shadow)">
    <rect width="516" height="312" rx="20" fill="url(#panel)" stroke="#85c759" stroke-opacity="0.35"/>
    <rect width="516" height="48" rx="20" fill="#1b261d"/>
    <rect y="28" width="516" height="20" fill="#1b261d"/>
    <circle cx="25" cy="24" r="5" fill="#ff6b6b"/>
    <circle cx="43" cy="24" r="5" fill="#ffd166"/>
    <circle cx="61" cy="24" r="5" fill="#8bea61"/>
    <text x="92" y="29" fill="#829087" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="12">main.rb</text>

    <g font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="15">
      <text x="28" y="85" fill="#b786ff">state</text>
      <text x="78" y="85" fill="#f6d365">:count</text>
      <text x="132" y="85" fill="#88968d">,</text>
      <text x="148" y="85" fill="#8bea61">0</text>

      <text x="28" y="120" fill="#7fdbff">app</text>
      <text x="62" y="120" fill="#f6d365">:main</text>
      <text x="107" y="120" fill="#88968d">,</text>
      <text x="123" y="120" fill="#d6e1d8">title:</text>
      <text x="179" y="120" fill="#ffad7a">"Counter"</text>
      <text x="267" y="120" fill="#88968d">do</text>

      <text x="48" y="155" fill="#7fdbff">column</text>
      <text x="109" y="155" fill="#d6e1d8">spacing:</text>
      <text x="184" y="155" fill="#8bea61">16</text>
      <text x="207" y="155" fill="#88968d">do</text>

      <text x="68" y="190" fill="#7fdbff">text</text>
      <text x="107" y="190" fill="#88968d">{</text>
      <text x="124" y="190" fill="#ffad7a">"Count: #{state.count}"</text>
      <text x="327" y="190" fill="#88968d">}</text>

      <text x="68" y="225" fill="#7fdbff">button</text>
      <text x="127" y="225" fill="#ffad7a">"Increment"</text>
      <text x="225" y="225" fill="#88968d">do</text>

      <text x="88" y="260" fill="#d6e1d8">state.count</text>
      <text x="190" y="260" fill="#88968d">+=</text>
      <text x="220" y="260" fill="#8bea61">1</text>

      <text x="68" y="290" fill="#88968d">end</text>
      <text x="392" y="290" fill="#76e247">● native</text>
    </g>
  </g>

  <rect x="0.5" y="0.5" width="1439" height="419" rx="27.5" fill="none" stroke="#b8ff6a" stroke-opacity="0.16"/>
</svg>
